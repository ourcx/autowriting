name: Build Executable (Python CLI)

# 旧的 Python CLI 打包，已停用自动触发
# Electron 桌面应用打包请看 electron-build.yml
on:
  workflow_dispatch:  # 仅保留手动触发

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: autowriting.exe
            asset_name: autowriting-windows.exe
          - os: macos-latest
            artifact_name: autowriting
            asset_name: autowriting-macos
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller
      
      - name: Build executable
        run: |
          cd app
          pyinstaller --onefile --name autowriting --console --clean autowriting.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: app/dist/${{ matrix.artifact_name }}
          retention-days: 30
