name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend artifact
        run: |
          set -euo pipefail
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          tar -C web -czf web-dist.tar.gz dist

      - name: Upload frontend artifact
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: web-dist.tar.gz
          target: /home/admin/autowriting
          overwrite: true
          timeout: 30s
          command_timeout: 2m
          debug: true

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            PROJECT_DIR=/home/admin/autowriting
            ARTIFACT="$PROJECT_DIR/web-dist.tar.gz"
            BACKUP_ROOT=/home/admin/autowriting-backups
            TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
            BACKUP_DIR="$BACKUP_ROOT/$TIMESTAMP"

            cd "$PROJECT_DIR"
            test -f "$ARTIFACT"

            echo "[deploy] snapshot runtime data"
            mkdir -p "$BACKUP_DIR"
            if test -f web/data/app.db; then
              if command -v sqlite3 >/dev/null 2>&1; then
                sqlite3 web/data/app.db ".backup '$BACKUP_DIR/app.db'"
              else
                cp -a web/data/app.db "$BACKUP_DIR/app.db"
                test ! -f web/data/app.db-wal || cp -a web/data/app.db-wal "$BACKUP_DIR/app.db-wal"
                test ! -f web/data/app.db-shm || cp -a web/data/app.db-shm "$BACKUP_DIR/app.db-shm"
              fi
            fi
            if test -d "公众号写作/drafts"; then
              tar -C "公众号写作" -czf "$BACKUP_DIR/drafts.tar.gz" drafts
            fi
            find "$BACKUP_ROOT" -mindepth 1 -maxdepth 1 -type d -mtime +30 -exec rm -rf {} +

            echo "[deploy] verify source tree"
            DIRTY="$(git status --porcelain --untracked-files=no -- . \
              ':(exclude)web/data' \
              ':(exclude)公众号写作/drafts' \
              ':(exclude)logs')"
            if test -n "$DIRTY"; then
              echo "Tracked source changes found on the server; deployment stopped."
              echo "$DIRTY"
              exit 1
            fi

            echo "[deploy] pull main branch"
            git checkout main
            git pull --ff-only origin main

            echo "[deploy] restore runtime drafts after source update"
            if test -f "$BACKUP_DIR/drafts.tar.gz"; then
              mkdir -p "公众号写作/drafts"
              tar -xzf "$BACKUP_DIR/drafts.tar.gz" -C "公众号写作"
            fi

            echo "[deploy] install dependencies and frontend artifact"
            pnpm --dir web install --frozen-lockfile --prefer-offline
            tar -xzf "$ARTIFACT" -C web
            rm -f "$ARTIFACT"
            test -f web/dist/index.html

            echo "[deploy] restart PM2; Nginx keeps proxying port 3000"
            cd web
            if pm2 describe autowriting >/dev/null 2>&1; then
              pm2 restart autowriting --update-env
            else
              pm2 start ecosystem.config.cjs --only autowriting
            fi

            echo "[deploy] health check"
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error http://127.0.0.1:3000/health; then
                break
              fi
              if test "$attempt" -eq 5; then
                echo "[deploy] health check failed"
                pm2 logs autowriting --lines 100 --nostream || true
                exit 1
              fi
              sleep 2
            done
            pm2 status autowriting
