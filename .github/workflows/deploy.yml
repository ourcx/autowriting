name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Build frontend
        run: |
          cd web
          pnpm install
          pnpm build
      
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/admin/autowriting
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Server has local tracked changes. Abort deploy to avoid overwriting data."
              git status --short
              exit 1
            fi
            git pull --no-rebase origin main
            cd web
            pnpm install
            pnpm build
            pm2 reload autowriting