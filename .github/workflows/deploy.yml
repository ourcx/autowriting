name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build deployment release
        run: |
          set -euo pipefail
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          mkdir -p deploy-release
          git archive --format=tar "$GITHUB_SHA" -- \
            . \
            ':(exclude)node_modules' \
            ':(exclude)web/node_modules' \
            ':(exclude)web/dist' \
            ':(exclude)web/data' \
            ':(exclude)公众号写作/drafts' \
            ':(exclude)logs' \
            ':(exclude)web/logs' \
            | tar -x -C deploy-release
          rm -f deploy-release/.env deploy-release/web/.env
          cp -a web/dist deploy-release/web/dist
          printf '%s\n' "$GITHUB_SHA" > deploy-release/.deploy-revision
          (
            cd deploy-release
            find . -type f \
              ! -path './.deploy-manifest' \
              -print \
              | sed 's#^\./##' \
              | LC_ALL=C sort > .deploy-manifest
          )
          tar -C deploy-release -czf autowriting-release.tar.gz .

      - name: Upload deployment release
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: autowriting-release.tar.gz
          target: /home/admin/autowriting
          overwrite: true
          timeout: 30s
          command_timeout: 2m
          debug: true

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 备份已观测到超过六分钟，为后续安装和健康检查保留时间。
          command_timeout: 30m
          script: |
            set -euo pipefail
            PROJECT_DIR=/home/admin/autowriting
            ARCHIVE="$PROJECT_DIR/autowriting-release.tar.gz"
            BACKUP_ROOT=/home/admin/autowriting-backups
            TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
            BACKUP_DIR="$BACKUP_ROOT/$TIMESTAMP"
            STAGING_DIR="$(mktemp -d "$PROJECT_DIR/.deploy.XXXXXX")"
            cleanup() {
              rm -rf "$STAGING_DIR"
            }
            is_safe_managed_file() {
              case "$1" in
                ""|/*|../*|*/../*|*/..)
                  return 1
                  ;;
              esac
              return 0
            }
            trap cleanup EXIT

            cd "$PROJECT_DIR"
            test -f "$ARCHIVE"

            echo "[deploy] snapshot runtime data"
            mkdir -p "$BACKUP_DIR"
            if test -f web/data/app.db; then
              if command -v sqlite3 >/dev/null 2>&1; then
                sqlite3 web/data/app.db ".backup '$BACKUP_DIR/app.db'"
              else
                cp -a web/data/app.db "$BACKUP_DIR/app.db"
                test ! -f web/data/app.db-wal || cp -a web/data/app.db-wal "$BACKUP_DIR/app.db-wal"
                test ! -f web/data/app.db-shm || cp -a web/data/app.db-shm "$BACKUP_DIR/app.db-shm"
              fi
            fi
            if test -d "公众号写作/drafts"; then
              tar -C "公众号写作" -czf "$BACKUP_DIR/drafts.tar.gz" drafts
            fi
            if test -d logs; then
              tar -czf "$BACKUP_DIR/app-logs.tar.gz" logs
            fi
            if test -d web/logs; then
              tar -C web -czf "$BACKUP_DIR/pm2-logs.tar.gz" logs
            fi
            test ! -f .env || cp -a .env "$BACKUP_DIR/root.env"
            test ! -f web/.env || cp -a web/.env "$BACKUP_DIR/web.env"
            if test -d .git; then
              git rev-parse HEAD > "$BACKUP_DIR/server-head.txt" || true
              git bundle create "$BACKUP_DIR/server-head.bundle" HEAD || true
              git diff HEAD --binary > "$BACKUP_DIR/server-source.patch" || true
              git status --short > "$BACKUP_DIR/server-source-status.txt" || true
              UNTRACKED_LIST="$BACKUP_DIR/server-untracked-files.txt"
              git ls-files -z --others --exclude-standard -- \
                . \
                ':(exclude)autowriting-release.tar.gz' \
                ':(exclude).deploy-manifest' \
                > "$UNTRACKED_LIST"
              if test -s "$UNTRACKED_LIST"; then
                tar --null -czf "$BACKUP_DIR/server-untracked.tar.gz" -T "$UNTRACKED_LIST"
              else
                rm -f "$UNTRACKED_LIST"
              fi
            fi
            find "$BACKUP_ROOT" -mindepth 1 -maxdepth 1 -type d -mtime +30 -exec rm -rf {} +

            echo "[deploy] extract and verify release"
            tar -xzf "$ARCHIVE" -C "$STAGING_DIR"
            test -f "$STAGING_DIR/.deploy-revision"
            test -f "$STAGING_DIR/.deploy-manifest"
            test -f "$STAGING_DIR/web/package.json"
            test -f "$STAGING_DIR/web/dist/index.html"
            test ! -e "$STAGING_DIR/web/data"
            test ! -e "$STAGING_DIR/公众号写作/drafts"
            test ! -e "$STAGING_DIR/logs"
            test ! -e "$STAGING_DIR/web/logs"
            test ! -e "$STAGING_DIR/.env"
            test ! -e "$STAGING_DIR/web/.env"

            echo "[deploy] remove files deleted by the new release"
            if test -f .deploy-manifest; then
              while IFS= read -r managed_file; do
                if ! is_safe_managed_file "$managed_file"; then
                  echo "[deploy] unsafe path in existing manifest: $managed_file"
                  exit 1
                fi
                if ! grep -Fxq -- "$managed_file" "$STAGING_DIR/.deploy-manifest"; then
                  rm -f -- "$PROJECT_DIR/$managed_file"
                fi
              done < .deploy-manifest
            elif test -d .git; then
              git ls-files | while IFS= read -r managed_file; do
                case "$managed_file" in
                  web/data/*|公众号写作/drafts/*|logs/*|web/logs/*)
                    continue
                    ;;
                esac
                if ! is_safe_managed_file "$managed_file"; then
                  echo "[deploy] unsafe path from git index: $managed_file"
                  exit 1
                fi
                if ! grep -Fxq -- "$managed_file" "$STAGING_DIR/.deploy-manifest"; then
                  rm -f -- "$PROJECT_DIR/$managed_file"
                fi
              done
            fi

            echo "[deploy] install release without touching runtime data"
            echo "[deploy] copy release files at $(date -u +%FT%TZ)"
            cp -a "$STAGING_DIR"/. "$PROJECT_DIR"/
            echo "[deploy] release files copied at $(date -u +%FT%TZ)"
            rm -f "$ARCHIVE"
            echo "[deploy] install dependencies at $(date -u +%FT%TZ)"
            pnpm --dir web install --frozen-lockfile --prefer-offline
            echo "[deploy] dependencies installed at $(date -u +%FT%TZ)"
            test -f web/dist/index.html

            echo "[deploy] restart PM2; Nginx keeps proxying port 3000"
            cd web
            if pm2 describe autowriting >/dev/null 2>&1; then
              pm2 restart autowriting --update-env
            else
              pm2 start ecosystem.config.cjs --only autowriting
            fi

            echo "[deploy] health check"
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error http://127.0.0.1:3000/health; then
                break
              fi
              if test "$attempt" -eq 5; then
                echo "[deploy] health check failed"
                pm2 logs autowriting --lines 100 --nostream || true
                exit 1
              fi
              sleep 2
            done
            pm2 status autowriting
