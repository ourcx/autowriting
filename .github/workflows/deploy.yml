name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Build frontend
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build

      - name: Package frontend assets
        run: tar -C web -czf web-dist.tar.gz dist

      - name: Upload frontend assets
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: web-dist.tar.gz
          target: /home/admin/autowriting
          overwrite: true
      
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            echo "[deploy] cwd"
            cd /home/admin/autowriting
            echo "[deploy] check dirty files"
            DIRTY="$(git status --porcelain --untracked-files=no -- . ':(exclude)公众号写作/drafts' ':(exclude)logs')"
            if [ -n "$DIRTY" ]; then
              echo "Server has local tracked changes outside runtime data. Abort deploy to avoid overwriting data."
              echo "$DIRTY"
              exit 1
            fi
            echo "[deploy] git pull"
            git pull --no-rebase origin main
            echo "[deploy] install web dependencies"
            cd web
            pnpm install --frozen-lockfile
            echo "[deploy] install frontend assets"
            mkdir -p dist
            tar -xzf ../web-dist.tar.gz -C .
            rm -f ../web-dist.tar.gz
            echo "[deploy] restart pm2 app"
            if pm2 describe autowriting >/dev/null 2>&1; then
              pm2 restart autowriting --update-env
            else
              pm2 start ecosystem.config.cjs --only autowriting
            fi
            echo "[deploy] pm2 status"
            pm2 status autowriting
