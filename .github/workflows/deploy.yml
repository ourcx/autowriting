name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Build frontend
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build

      - name: Package deployment release
        run: |
          set -euo pipefail
          rm -rf deploy-release
          mkdir -p deploy-release
          git archive --format=tar "$GITHUB_SHA" | tar -x -C deploy-release
          cp -R web/dist deploy-release/web/dist
          printf '%s\n' "$GITHUB_SHA" > deploy-release/.deploy-revision
          tar -C deploy-release -czf autowriting-release.tar.gz .

      - name: Upload deployment release
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: autowriting-release.tar.gz
          target: /home/admin/autowriting
          overwrite: true
          timeout: 30s
          command_timeout: 2m
          debug: true
      
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            PROJECT_DIR=/home/admin/autowriting
            ARCHIVE="$PROJECT_DIR/autowriting-release.tar.gz"
            STAGING_DIR="$(mktemp -d "$PROJECT_DIR/.deploy.XXXXXX")"
            cleanup() {
              rm -rf "$STAGING_DIR"
            }
            trap cleanup EXIT

            echo "[deploy] extract release package"
            test -f "$ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$STAGING_DIR"
            test -f "$STAGING_DIR/web/package.json"
            test -f "$STAGING_DIR/web/dist/index.html"
            RELEASE_SHA="$(cat "$STAGING_DIR/.deploy-revision")"
            NEEDS_INSTALL=1
            if test -f "$PROJECT_DIR/web/package.json" \
              && test -f "$PROJECT_DIR/web/pnpm-lock.yaml" \
              && cmp -s "$STAGING_DIR/web/package.json" "$PROJECT_DIR/web/package.json" \
              && cmp -s "$STAGING_DIR/web/pnpm-lock.yaml" "$PROJECT_DIR/web/pnpm-lock.yaml"; then
              NEEDS_INSTALL=0
            fi

            echo "[deploy] deploy release $RELEASE_SHA"
            cd "$PROJECT_DIR"
            # 只覆盖由 GitHub Actions 打包的代码和前端产物；运行时草稿、日志及
            # 未跟踪的服务器配置保持不变，因此部署服务器无需访问 github.com。
            git ls-files | while IFS= read -r tracked_file; do
              if ! test -e "$STAGING_DIR/$tracked_file"; then
                rm -f "$PROJECT_DIR/$tracked_file"
              fi
            done
            cp -a "$STAGING_DIR"/. "$PROJECT_DIR"/
            rm -f "$ARCHIVE"
            if test "$NEEDS_INSTALL" -eq 1; then
              echo "[deploy] dependencies changed; install web dependencies"
              cd web
              pnpm install --frozen-lockfile --prefer-offline
            else
              echo "[deploy] dependencies unchanged; skip pnpm install"
            fi
            echo "[deploy] restart pm2 app"
            cd "$PROJECT_DIR/web"
            if pm2 describe autowriting >/dev/null 2>&1; then
              pm2 restart autowriting --update-env
            else
              pm2 start ecosystem.config.cjs --only autowriting
            fi
            echo "[deploy] health check"
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error http://127.0.0.1:3000/health; then
                break
              fi
              if test "$attempt" -eq 5; then
                echo "[deploy] health check failed"
                pm2 logs autowriting --lines 100 --nostream || true
                exit 1
              fi
              sleep 2
            done
            echo "[deploy] pm2 status"
            pm2 status autowriting
