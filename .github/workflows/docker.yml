name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - .dockerignore
      - web/package.json
      - web/pnpm-lock.yaml
      - web/server.ts
      - web/server/**
      - web/shared/**
      - scripts/docker-*.sh
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - .dockerignore
      - web/package.json
      - web/pnpm-lock.yaml
      - web/server.ts
      - web/server/**
      - web/shared/**
      - scripts/docker-*.sh
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Start container
        run: ./scripts/docker-start.sh

      - name: Run Docker smoke
        run: ./scripts/docker-smoke.sh

      - name: Test backup
        run: |
          backup_dir="$RUNNER_TEMP/autowriting-backup"
          ./scripts/docker-backup.sh "$backup_dir"
          test -f "$backup_dir/data.tar.gz"
          test -f "$backup_dir/drafts.tar.gz"
          test -f "$backup_dir/SHA256SUMS"
          test -f "$backup_dir/logs.tar.gz"
          test -f "$backup_dir/manifest.txt"
          (cd "$backup_dir" && sha256sum -c SHA256SUMS)
          tar -tzf "$backup_dir/data.tar.gz" > "$RUNNER_TEMP/data-backup-contents.txt"
          grep -Eq '^\./app\.db$' "$RUNNER_TEMP/data-backup-contents.txt"
          tar -tzf "$backup_dir/drafts.tar.gz" > /dev/null
          tar -tzf "$backup_dir/logs.tar.gz" > /dev/null
          # Backup pauses the service; also verify it was restarted successfully.
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/health > /dev/null

      - name: Print diagnostics
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --tail=200 autowriting || true

      - name: Stop container
        if: always()
        run: docker compose down
