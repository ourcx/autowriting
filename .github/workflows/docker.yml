name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - .dockerignore
      - web/package.json
      - web/pnpm-lock.yaml
      - web/server.ts
      - web/server/**
      - web/shared/**
      - scripts/docker-*.sh
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - .dockerignore
      - web/package.json
      - web/pnpm-lock.yaml
      - web/server.ts
      - web/server/**
      - web/shared/**
      - scripts/docker-*.sh
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Start container
        run: ./scripts/docker-start.sh

      - name: Run Docker smoke
        run: ./scripts/docker-smoke.sh

      - name: Test backup
        run: |
          backup_dir="$RUNNER_TEMP/autowriting-backup"
          ./scripts/docker-backup.sh "$backup_dir"
          test -f "$backup_dir/data.tar.gz"
          test -f "$backup_dir/drafts.tar.gz"
          test -f "$backup_dir/SHA256SUMS"

      - name: Print diagnostics
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --tail=200 autowriting || true

      - name: Stop container
        if: always()
        run: docker compose down
