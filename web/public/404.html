<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#fffaf0" />
    <title>页面不存在 | Dashy</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 32px;
        background: #fffaf0;
        color: #0a0a0a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 620px);
      }
      strong {
        color: #6a6a6a;
        font-size: 14px;
      }
      h1 {
        margin: 16px 0 12px;
        font-size: 56px;
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: 0;
      }
      p {
        margin: 0 0 28px;
        color: #3a3a3a;
        font-size: 17px;
        line-height: 1.65;
      }
      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        padding: 0 20px;
        border-radius: 8px;
        background: #0a0a0a;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      @media (max-width: 640px) {
        h1 {
          font-size: 40px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <strong>404</strong>
      <h1>这个页面不存在</h1>
      <p>地址可能已经失效，也可能从未存在。返回 Dashy 首页继续使用内容创作工作台。</p>
      <a href="/">返回首页</a>
    </main>
  </body>
</html>
